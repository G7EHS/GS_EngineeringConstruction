const nav=document.getElementById('languages'),grid=document.getElementById('rules'),picker=document.getElementById('language');
LANGS.forEach(l=>{const b=document.createElement('button');b.type='button';b.dataset.lang=l.code;b.setAttribute('aria-label',l.name);const f=document.createElement('span');f.className='flag';f.setAttribute('aria-hidden','true');f.textContent=l.flag;const name=document.createElement('span');name.lang=l.code;name.textContent=l.code==='bn'?'বাংলা · Bangla':l.name;b.append(f,name);b.onclick=()=>{choose(l.code,true);picker.open=false;picker.querySelector('summary').focus()};nav.append(b)});
function choose(code,write=false){const l=LANGS.find(x=>x.code===code)||LANGS[0];document.documentElement.lang=l.code;document.title='GS건설 '+l.title;document.getElementById('title').textContent='GS건설 '+l.title;document.getElementById('selected-flag').textContent=l.flag;document.getElementById('selected-name').textContent=l.code==='bn'?'Bangla':l.name;grid.setAttribute('aria-label',l.title);grid.replaceChildren();l.rules.forEach((text,i)=>{const card=document.createElement('article');card.className='card';const pic=document.createElement('div');pic.className='picture';const num=document.createElement('span');num.className='num';num.textContent=i+1;num.setAttribute('aria-hidden','true');const img=document.createElement('img');img.src=IMAGES[i];img.alt=l.titles[i];img.width=278;img.height=254;pic.append(num,img);const copy=document.createElement('div');copy.className='copy';const h=document.createElement('h2');h.textContent=(i+1)+'. '+l.titles[i];const p=document.createElement('p');p.textContent=text;copy.append(h,p);card.append(pic,copy);grid.append(card)});nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l.code)));if(write){try{history.replaceState(null,'',l.code==='ko'?location.pathname+location.search:'#'+l.code)}catch{}}}
function read(){choose(location.hash.slice(1).replace(/^lang=/,'')||'ko')}read();addEventListener('hashchange',read);document.addEventListener('click',e=>{if(!picker.contains(e.target))picker.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&picker.open){picker.open=false;picker.querySelector('summary').focus()}});
</script></body></html>
